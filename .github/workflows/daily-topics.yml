name: Daily Topic Collection

on:
  schedule:
    # 07:00 UTC every day — adjust to your timezone preference
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python collect_topics.py

      - name: Commit updated topics
        run: |
          git config user.name "qts-topic-bot"
          git config user.email "actions@github.com"
          git add topics.json topics/
          git diff --cached --quiet || git commit -m "Daily topic collection: $(date -u +%Y-%m-%d)"
          git push
